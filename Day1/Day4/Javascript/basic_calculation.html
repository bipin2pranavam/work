<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //Basic Operations
//Arithmetic Operators

    let a=20;
    let b=30;
    console.log(a+b);
    console.log(a-b);
    console.log(a*b);
    console.log(a/b);

    //Comparison operators

    let x=10;
    let y=20
    document.write(x>y);
    document.write("<br>")
     document.write(x<y);
      document.write("<br>")
      document.write(x==y);
       document.write("<br>")
       document.write(!(x>=y));
</script>
</body>
</html>
